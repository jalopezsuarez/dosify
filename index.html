<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="color-scheme" content="light dark">
  <title>Dosify</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@ionic/core@9.0.8/css/ionic.bundle.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@ionic/core@9.0.8/css/palettes/dark.system.css">
  <style>
    /* Color principal (tint) con las variables de tema de Ionic */
    :root {
      --ion-color-primary: #56bde3;
      --ion-color-primary-rgb: 86, 189, 227;
      --ion-color-primary-contrast: #000000;
      --ion-color-primary-contrast-rgb: 0, 0, 0;
      --ion-color-primary-shade: #4ca6c8;
      --ion-color-primary-tint: #67c4e6;
    }
    /* Color propio «teal» (#78b7af) para el icono de información, según «Adding colors» de Ionic */
    :root {
      --ion-color-teal: #78b7af;
      --ion-color-teal-rgb: 120, 183, 175;
      --ion-color-teal-contrast: #000000;
      --ion-color-teal-contrast-rgb: 0, 0, 0;
      --ion-color-teal-shade: #6aa19a;
      --ion-color-teal-tint: #86beb7;
    }
    .ion-color-teal {
      --ion-color-base: var(--ion-color-teal) !important;
      --ion-color-base-rgb: var(--ion-color-teal-rgb) !important;
      --ion-color-contrast: var(--ion-color-teal-contrast) !important;
      --ion-color-contrast-rgb: var(--ion-color-teal-contrast-rgb) !important;
      --ion-color-shade: var(--ion-color-teal-shade) !important;
      --ion-color-tint: var(--ion-color-teal-tint) !important;
    }
  </style>
  <script type="module" src="https://cdn.jsdelivr.net/npm/@ionic/core@9.0.8/dist/ionic/ionic.esm.js"></script>
  <script type="module" src="app.js"></script>
</head>
<body>
<ion-app>

  <ion-header>
    <ion-toolbar>
      <ion-title>Toma</ion-title>
      <ion-buttons slot="end">
        <ion-button id="manage"><ion-icon slot="start" name="list"></ion-icon>Pautas</ion-button>
      </ion-buttons>
    </ion-toolbar>
    <ion-toolbar>
      <ion-segment id="day" scrollable="true"></ion-segment>
    </ion-toolbar>
    <ion-toolbar>
      <ion-segment id="slot">
        <ion-segment-button value="M"><ion-label>Mañana</ion-label></ion-segment-button>
        <ion-segment-button value="T"><ion-label>Tarde</ion-label></ion-segment-button>
        <ion-segment-button value="N"><ion-label>Noche</ion-label></ion-segment-button>
      </ion-segment>
    </ion-toolbar>
  </ion-header>
  <ion-content id="toma" color="light"></ion-content>

  <ion-modal id="manager">
    <ion-header>
      <ion-toolbar>
        <ion-buttons slot="start"><ion-button id="close">Cerrar</ion-button></ion-buttons>
        <ion-title>Pautas</ion-title>
        <ion-buttons slot="end">
          <ion-button id="add"><ion-icon slot="start" name="add"></ion-icon>Añadir</ion-button>
        </ion-buttons>
      </ion-toolbar>
    </ion-header>
    <ion-content color="light">
      <ion-list-header><ion-label>Pautas</ion-label></ion-list-header>
      <ion-list inset="true">
        <ion-reorder-group id="list" disabled="false"></ion-reorder-group>
      </ion-list>
      <ion-list-header><ion-label>Datos</ion-label></ion-list-header>
      <ion-list inset="true">
        <ion-item button id="import"><ion-icon slot="start" name="cloud-upload-outline"></ion-icon><ion-label>Cargar CSV (pautas y tomas)</ion-label></ion-item>
        <ion-item button id="export"><ion-icon slot="start" name="cloud-download-outline"></ion-icon><ion-label>Exportar CSV (pautas y tomas)</ion-label></ion-item>
      </ion-list>
      <ion-list inset="true">
        <ion-item button detail="false" id="clear-log"><ion-label color="danger" class="ion-text-center">Borrar registro de tomas</ion-label></ion-item>
      </ion-list>
      <input type="file" id="file" accept=".csv,text/csv" hidden>
    </ion-content>
  </ion-modal>

  <ion-modal id="editor">
    <ion-header>
      <ion-toolbar>
        <ion-buttons slot="start"><ion-button id="cancel">Cancelar</ion-button></ion-buttons>
        <ion-title>Pauta</ion-title>
        <ion-buttons slot="end"><ion-button id="save" strong="true">Guardar</ion-button></ion-buttons>
      </ion-toolbar>
    </ion-header>
    <ion-content color="light">
      <ion-list-header><ion-label>Medicamento</ion-label></ion-list-header>
      <ion-list inset="true">
        <ion-item><ion-input name="name" label="Nombre" label-placement="stacked" placeholder="Paracetamol"></ion-input></ion-item>
        <ion-item><ion-input name="dose" label="Dosis" label-placement="stacked" placeholder="1 comprimido de 500 mg"></ion-input></ion-item>
      </ion-list>
      <ion-list-header><ion-label>Tiempo</ion-label></ion-list-header>
      <ion-list inset="true">
        <ion-item><ion-input name="days" label="Duración (días)" label-placement="stacked" placeholder="Sin límite" inputmode="numeric"></ion-input></ion-item>
      </ion-list>
      <ion-list-header><ion-label>Tomas</ion-label></ion-list-header>
      <ion-list inset="true">
        <ion-item><ion-checkbox name="M">Mañana</ion-checkbox></ion-item>
        <ion-item><ion-checkbox name="T">Tarde</ion-checkbox></ion-item>
        <ion-item><ion-checkbox name="N">Noche</ion-checkbox></ion-item>
      </ion-list>
      <ion-list-header><ion-label>Notas</ion-label></ion-list-header>
      <ion-list inset="true">
        <ion-item><ion-textarea name="notes" label="Indicaciones" label-placement="stacked" placeholder="Con comida" auto-grow="true"></ion-textarea></ion-item>
        <ion-item><ion-textarea name="refs" label="Referencias" label-placement="stacked" placeholder="Otras anotaciones" auto-grow="true"></ion-textarea></ion-item>
      </ion-list>
      <ion-list inset="true" id="delete">
        <ion-item button detail="false"><ion-label color="danger" class="ion-text-center">Eliminar pauta</ion-label></ion-item>
      </ion-list>
    </ion-content>
  </ion-modal>

  <ion-modal id="info">
    <ion-header>
      <ion-toolbar>
        <ion-title id="info-title"></ion-title>
        <ion-buttons slot="end"><ion-button id="info-close">Cerrar</ion-button></ion-buttons>
      </ion-toolbar>
    </ion-header>
    <ion-content id="info-body" color="light"></ion-content>
  </ion-modal>

  <ion-alert id="confirm"></ion-alert>

</ion-app>
</body>
</html>
