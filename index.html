<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="color-scheme" content="light dark">
  <title>Dosify</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@ionic/core@9.0.8/css/ionic.bundle.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@ionic/core@9.0.8/css/palettes/dark.system.css">
  <script type="module" src="https://cdn.jsdelivr.net/npm/@ionic/core@9.0.8/dist/ionic/ionic.esm.js"></script>
  <script type="module" src="app.js"></script>
</head>
<body>
<ion-app>
  <ion-tabs>

    <ion-tab tab="pautas">
      <ion-header>
        <ion-toolbar>
          <ion-title>Pautas</ion-title>
          <ion-buttons slot="end">
            <ion-button id="add"><ion-icon slot="start" name="add"></ion-icon>Añadir</ion-button>
          </ion-buttons>
        </ion-toolbar>
        <ion-toolbar>
          <ion-segment id="filter" value="all">
            <ion-segment-button value="all"><ion-label>Todas</ion-label></ion-segment-button>
            <ion-segment-button value="M"><ion-label>Mañana</ion-label></ion-segment-button>
            <ion-segment-button value="T"><ion-label>Tarde</ion-label></ion-segment-button>
            <ion-segment-button value="N"><ion-label>Noche</ion-label></ion-segment-button>
          </ion-segment>
        </ion-toolbar>
      </ion-header>
      <ion-content id="pautas"></ion-content>
    </ion-tab>

    <ion-tab tab="toma">
      <ion-header>
        <ion-toolbar><ion-title>Toma</ion-title></ion-toolbar>
      </ion-header>
      <ion-content id="toma"></ion-content>
    </ion-tab>

    <ion-tab tab="ajustes">
      <ion-header>
        <ion-toolbar><ion-title>Ajustes</ion-title></ion-toolbar>
      </ion-header>
      <ion-content>
        <ion-list>
          <ion-list-header><ion-label>Pautas activas y orden</ion-label></ion-list-header>
          <ion-reorder-group id="order" disabled="false"></ion-reorder-group>
        </ion-list>
        <ion-list>
          <ion-list-header><ion-label>Datos</ion-label></ion-list-header>
          <ion-item button id="import"><ion-icon slot="start" name="cloud-upload-outline"></ion-icon><ion-label>Cargar pautas (CSV)</ion-label></ion-item>
          <ion-item button id="export"><ion-icon slot="start" name="cloud-download-outline"></ion-icon><ion-label>Exportar pautas (CSV)</ion-label></ion-item>
          <ion-item button id="export-log"><ion-icon slot="start" name="cloud-download-outline"></ion-icon><ion-label>Exportar registro (CSV)</ion-label></ion-item>
          <ion-item button id="clear-log"><ion-icon slot="start" name="trash-outline" color="danger"></ion-icon><ion-label color="danger">Borrar registro</ion-label></ion-item>
        </ion-list>
        <input type="file" id="file" accept=".csv,text/csv" hidden>
      </ion-content>
    </ion-tab>

    <ion-tab-bar slot="bottom">
      <ion-tab-button tab="pautas"><ion-icon name="list"></ion-icon><ion-label>Pautas</ion-label></ion-tab-button>
      <ion-tab-button tab="toma"><ion-icon name="checkmark-circle"></ion-icon><ion-label>Toma</ion-label></ion-tab-button>
      <ion-tab-button tab="ajustes"><ion-icon name="settings"></ion-icon><ion-label>Ajustes</ion-label></ion-tab-button>
    </ion-tab-bar>

  </ion-tabs>

  <ion-modal id="editor">
    <ion-header>
      <ion-toolbar>
        <ion-buttons slot="start"><ion-button id="cancel">Cancelar</ion-button></ion-buttons>
        <ion-title>Pauta</ion-title>
        <ion-buttons slot="end"><ion-button id="save" strong="true">Guardar</ion-button></ion-buttons>
      </ion-toolbar>
    </ion-header>
    <ion-content>
      <ion-list>
        <ion-item><ion-input name="name" label="Nombre" label-placement="stacked" placeholder="Paracetamol"></ion-input></ion-item>
        <ion-item><ion-input name="dose" label="Dosis" label-placement="stacked" placeholder="500 mg"></ion-input></ion-item>
        <ion-item><ion-input name="M" label="Mañana" label-placement="stacked" placeholder="0" inputmode="decimal"></ion-input></ion-item>
        <ion-item><ion-input name="T" label="Tarde" label-placement="stacked" placeholder="0" inputmode="decimal"></ion-input></ion-item>
        <ion-item><ion-input name="N" label="Noche" label-placement="stacked" placeholder="0" inputmode="decimal"></ion-input></ion-item>
        <ion-item><ion-textarea name="notes" label="Indicaciones" label-placement="stacked" placeholder="Con comida" auto-grow="true"></ion-textarea></ion-item>
        <ion-item><ion-textarea name="refs" label="Referencias" label-placement="stacked" placeholder="Otras anotaciones" auto-grow="true"></ion-textarea></ion-item>
      </ion-list>
      <ion-button id="delete" expand="block" fill="clear" color="danger">Eliminar pauta</ion-button>
    </ion-content>
  </ion-modal>
  <ion-alert id="confirm"></ion-alert>
</ion-app>
</body>
</html>
